host: 127.0.0.1:8080
info:
  contact: {}
  description: ToDo Application REST-API scheme
  title: Golang ToDO API
  version: "1.0"
paths:
  /statistics:
    get:
      consumes:
      - application/json
      description: Get task statistics filtered by optional user and date range
      parameters:
      - description: User ID
        in: query
        name: user_id
        type: string
      - description: Start date in YYYY-MM-DD format
        format: date
        in: query
        name: date_from
        type: string
      - description: End date in YYYY-MM-DD format
        format: date
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved statistics
          schema:
            $ref: '#/definitions/internal_features_statistics_transport_http.GetStatisticsResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_NeverEverLive_todo-go_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_NeverEverLive_todo-go_internal_core_transport_http_response.ErrorResponse'
      summary: Get task statistics
      tags:
      - statistics
  /tasks:
    get:
      consumes:
      - application/json
      description: Get tasks filtered by an optional author user ID with optional
        pagination
      parameters:
      - description: Author user ID
        format: uuid
        in: query
        name: user_id
        type: string
      - description: Maximum number of tasks to return
        in: query
        minimum: 1
        name: limit
        type: integer
      - description: Number of tasks to skip
        in: query
        minimum: 1
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved tasks
          schema:
            items:
              $ref: '#/definitions/internal_features_tasks_transport_http.TaskDTOResponse'
            type: array
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_NeverEverLive_todo-go_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_NeverEverLive_todo-go_internal_core_transport_http_response.ErrorResponse'
      summary: Get tasks
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: Create a new task in the system
      parameters:
      - description: CreateTask request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_tasks_transport_http.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created task
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.CreateTaskResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_NeverEverLive_todo-go_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Author user not found
          schema:
            $ref: '#/definitions/github_com_NeverEverLive_todo-go_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_NeverEverLive_todo-go_internal_core_transport_http_response.ErrorResponse'
      summary: Create task
      tags:
      - tasks
  /tasks/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a task by ID
      parameters:
      - description: Task ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Successfully deleted task
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_NeverEverLive_todo-go_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/github_com_NeverEverLive_todo-go_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_NeverEverLive_todo-go_internal_core_transport_http_response.ErrorResponse'
      summary: Delete task
      tags:
      - tasks
    get:
      consumes:
      - application/json
      description: Get a task by ID
      parameters:
      - description: Task ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved task
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.GetTaskResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_NeverEverLive_todo-go_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/github_com_NeverEverLive_todo-go_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_NeverEverLive_todo-go_internal_core_transport_http_response.ErrorResponse'
      summary: Get task
      tags:
      - tasks
    patch:
      consumes:
      - application/json
      description: Partially update a task by ID
      parameters:
      - description: Task ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: PatchTask request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_tasks_transport_http.PatchTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully updated task
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.PatchTaskResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_NeverEverLive_todo-go_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/github_com_NeverEverLive_todo-go_internal_core_transport_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_NeverEverLive_todo-go_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_NeverEverLive_todo-go_internal_core_transport_http_response.ErrorResponse'
      summary: Patch task
      tags:
      - tasks
  /users:
    get:
      consumes:
      - application/json
      description: Get a paginated list of users
      parameters:
      - description: Maximum number of users to return
        in: query
        minimum: 1
        name: limit
        type: integer
      - description: Number of users to skip
        in: query
        minimum: 1
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved users
          schema:
            items:
              $ref: '#/definitions/internal_features_users_transport_http.UserDTOResponse'
