services:
    todo-app:
        build:
            context: ${PROJECT_ROOT}
            dockerfile: ${PROJECT_ROOT}/cmd/todoapp/Dockerfile
        container_name: todoapp
        environment:
            - HTTP_ADDR=:8080
            - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
            - LOGGER_LEVEL=${LOGGER_LEVEL}
            - LOGGER_FOLDER_PERMISSION=${LOGGER_FOLDER_PERMISSION}
            - LOGGER_FILE_PERMISSION=${LOGGER_FILE_PERMISSION}
            - POSTGRES_HOST=todo-app-postgres
            - LOGGER_FOLDER=/app/out/logs
        volumes:
            -   ${PROJECT_ROOT}/out/logs:/app/out/logs
        ports:
            - "8080:8080"
        restart: always

    todo-app-postgres:
        image: postgres:18.1-bookworm
        container_name: todo-app-postgres
        environment:
            - POSTGRES_USER=${POSTGRES_USER:-postgres}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
            - POSTGRES_DB=${POSTGRES_DB:-postgres}
        volumes:
            - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
        restart: always

    todo-app-postgres-migrate:
        image: migrate/migrate:v4.19.1
        volumes:
            - ${PROJECT_ROOT}/migrations:/migrations

    port-forwarder:
        image: alpine/socat:1.8.0.3
        container_name: todo-app-postgres-port-forwarder
        command: tcp-listen:5432,fork,reuseaddr tcp-connect:todo-app-postgres:5432
        ports:
            - "127.0.0.1:5432:5432"
